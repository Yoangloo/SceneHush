name: Bug report
description: Report a reproducible problem with SceneHush.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Choose a corner…\n2. Move the pointer…"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: macOS, SceneHush, and BetterDisplay versions.
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Display setup
      description: Built-in/external display models and connection type. Please omit serial numbers.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove private data before sharing.

