name: Import reviewed drag installation and first-run update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-ui-update.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Apply reviewed drag installation and first-run source
        run: |
          test "$(git rev-parse HEAD~2)" = "c6a88e59b465f122a4c6b6aba896c5d51fc4fd63"
          base64 --decode source-ui-update.b64 > /tmp/scenehush-ui-update.zip
          echo '61ea224cd28aa3dbe6a0e4ef0574e3ffbd984e2e2f5604ff8f06e27b6ef507f1  /tmp/scenehush-ui-update.zip' | sha256sum --check
          python3 - <<'SCENEHUSH_EXTRACT'
          import json, zipfile
          from pathlib import Path, PurePosixPath
          for name in json.loads('["scripts/installer/dmg/Finder-layout.dsstore"]'):
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] != '.github'
              Path(name).unlink()
          with zipfile.ZipFile('/tmp/scenehush-ui-update.zip') as archive:
              for name in archive.namelist():
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts and path.parts[0] != '.github'
              archive.extractall('.')
          SCENEHUSH_EXTRACT
          chmod +x scripts/*.sh
          git rm source-ui-update.b64
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Guide drag installation and require onboarding for each install'
          git push
