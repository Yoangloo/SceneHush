name: Import reviewed installer and status update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-ui-update.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Apply reviewed installer source and completion screenshots
        run: |
          test "$(git rev-parse HEAD~2)" = "1bd61e76604b38714e126446bc41bfb9936a252c"
          base64 --decode source-ui-update.b64 > /tmp/scenehush-ui-update.zip
          echo 'e0bfdd3116425ad831b41338c16c723c8ca32dcd68c50333249e695131508df9  /tmp/scenehush-ui-update.zip' | sha256sum --check
          python3 - <<'SCENEHUSH_EXTRACT'
          import zipfile
          from pathlib import PurePosixPath
          with zipfile.ZipFile('/tmp/scenehush-ui-update.zip') as archive:
              for name in archive.namelist():
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts and path.parts[0] != '.github'
              archive.extractall('.')
          SCENEHUSH_EXTRACT
          chmod +x scripts/*.sh
          git rm source-ui-update.b64
          git diff --check
          git add .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add native installer and clearer completion status'
          git push
