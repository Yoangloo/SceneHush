name: Import reviewed UI consistency update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-ui-update.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Apply reviewed source and interface screenshots
        run: |
          test "$(git rev-parse HEAD~2)" = "7f5301818e2d1bfd0b98925e21524c5cef0bde3e"
          base64 --decode source-ui-update.b64 > /tmp/scenehush-ui-update.zip
          echo '6b94133053482464722aee5692bc1d029ae7cdf5636a8fe82d8738af5d322155  /tmp/scenehush-ui-update.zip' | sha256sum --check
          python3 - <<'SCENEHUSH_EXTRACT'
          import zipfile
          from pathlib import PurePosixPath
          with zipfile.ZipFile('/tmp/scenehush-ui-update.zip') as archive:
              for name in archive.namelist():
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts and path.parts[0] != '.github'
              archive.extractall('.')
          SCENEHUSH_EXTRACT
          git rm source-ui-update.b64
          git diff --check
          git add .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Unify action buttons and add GitHub support footer'
          git push
