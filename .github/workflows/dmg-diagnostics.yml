name: Diagnose DMG bookmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bookmarks:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Resolve lightweight native HFS+ bookmark matrix
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="${1:-$PWD}"
          PROBE_WORK="$(mktemp -d "${TMPDIR:-/tmp}/SceneHush-bookmark-probe.XXXXXX")"
          PROBE_VOLUME=""
          cleanup() {
            if [[ -n "$PROBE_VOLUME" ]] && ! hdiutil detach "$PROBE_VOLUME" >/dev/null; then
              printf 'Temporary volume remains mounted; keeping %s.\n' "$PROBE_WORK" >&2
              return
            fi
            rm -rf "$PROBE_WORK"
          }
          trap cleanup EXIT
          sw_vers
          mkdir -p "$PROBE_WORK/source/.background"
          printf 'SceneHush bookmark fixture\n' > "$PROBE_WORK/source/.background/background.png"
          cat > "$PROBE_WORK/probe.m" <<'SCENEHUSH_OBJC'
          #import <Foundation/Foundation.h>
          #import <CoreServices/CoreServices.h>

          static id nullable(id value) {
              return value ?: [NSNull null];
          }

          static void emit(NSDictionary *record) {
              NSError *error = nil;
              NSData *data = [NSJSONSerialization dataWithJSONObject:record options:NSJSONWritingSortedKeys error:&error];
              if (!data) {
                  fprintf(stderr, "Could not encode probe output: %s\n", error.localizedDescription.UTF8String);
                  exit(2);
              }
              [[NSFileHandle fileHandleWithStandardOutput] writeData:data];
              [[NSFileHandle fileHandleWithStandardOutput] writeData:[@"\n" dataUsingEncoding:NSUTF8StringEncoding]];
          }

          static int failure(NSString *message) {
              fprintf(stderr, "%s\n", message.UTF8String);
              return 2;
          }

          static void resolve(NSString *name, NSData *data, NSString *label,
                              NSURLBookmarkResolutionOptions flags, NSURL *expected) {
              NSError *error = nil;
              BOOL stale = NO;
              NSURL *resolved = [NSURL URLByResolvingBookmarkData:data options:flags relativeToURL:nil
                                        bookmarkDataIsStale:&stale error:&error];
              NSURL *pathURL = resolved.filePathURL;
              NSString *canonical = pathURL.path.stringByResolvingSymlinksInPath;
              NSString *expectedPath = expected.path.stringByResolvingSymlinksInPath;
              BOOL matches = canonical != nil && [canonical isEqualToString:expectedPath];
              emit(@{
                  @"variant": name,
                  @"flags": label,
                  @"data_size": @(data.length),
                  @"resolvedURL": nullable(resolved.absoluteString),
                  @"rawPath": nullable(resolved.path),
                  @"filePath": nullable(pathURL.path),
                  @"isFileReference": @([resolved isFileReferenceURL]),
                  @"stale": @(stale),
                  @"error_domain": nullable(error.domain),
                  @"error_code": @(error.code),
                  @"error_desc": nullable(error.localizedDescription),
                  @"target_matches": @(matches)
              });
          }

          int main(int argc, const char *argv[]) {
              @autoreleasepool {
                  if (argc == 4 && strcmp(argv[1], "create") == 0) {
                      NSURL *file = [NSURL fileURLWithPath:@(argv[2]) isDirectory:NO];
                      NSError *error = nil;
                      NSData *data = [file bookmarkDataWithOptions:
                          NSURLBookmarkCreationMinimalBookmark | NSURLBookmarkCreationWithoutImplicitSecurityScope
                          includingResourceValuesForKeys:nil relativeToURL:nil error:&error];
                      if (!data || ![data writeToFile:@(argv[3]) options:NSDataWritingAtomic error:&error])
                          return failure([NSString stringWithFormat:@"Native bookmark creation failed: %@", error]);
                      return 0;
                  }
                  if (argc != 3) return failure(@"Usage: probe EXPECTED_FILE VARIANTS.plist");
                  NSURL *expected = [NSURL fileURLWithPath:@(argv[1]) isDirectory:NO];
                  if (![[NSFileManager defaultManager] fileExistsAtPath:expected.path])
                      return failure(@"Expected fixture file does not exist");
                  NSError *error = nil;
                  NSData *input = [NSData dataWithContentsOfFile:@(argv[2]) options:0 error:&error];
                  if (!input) return failure([@"Could not read variants plist: " stringByAppendingString:error.localizedDescription]);
                  id parsed = [NSPropertyListSerialization propertyListWithData:input options:NSPropertyListImmutable
                                                                       format:NULL error:&error];
                  if (![parsed isKindOfClass:[NSDictionary class]])
                      return failure([NSString stringWithFormat:@"Variants must be a dictionary of name:NSData: %@",
                                      error.localizedDescription ?: @"invalid property list type"]);
                  NSMutableDictionary<NSString *, NSData *> *variants = [parsed mutableCopy];
                  for (id key in variants) {
                      if (![key isKindOfClass:[NSString class]] || ![variants[key] isKindOfClass:[NSData class]])
                          return failure(@"Each variant must have a string name and NSData value");
                  }
                  emit(@{
                      @"kind": @"metadata",
                      @"os": NSProcessInfo.processInfo.operatingSystemVersionString,
                      @"expectedURL": expected.absoluteString,
                      @"expectedFile": expected.path,
                      @"expectedCanonicalPath": expected.path.stringByResolvingSymlinksInPath
                  });
                  error = nil;
                  NSData *native = [expected bookmarkDataWithOptions:
                      NSURLBookmarkCreationMinimalBookmark | NSURLBookmarkCreationWithoutImplicitSecurityScope
                      includingResourceValuesForKeys:nil relativeToURL:nil error:&error];
                  if (!native) {
                      emit(@{
                          @"variant": @"native-minimal",
                          @"phase": @"creation",
                          @"error_domain": nullable(error.domain),
                          @"error_code": @(error.code),
                          @"error_desc": nullable(error.localizedDescription),
                          @"target_matches": @NO
                      });
                      return failure(@"Native minimal bookmark creation failed; fixture is not a valid control");
                  }
                  if (variants[@"native-minimal"] != nil)
                      return failure(@"Variant name native-minimal is reserved for the native control");
                  variants[@"native-minimal"] = native;
                  NSArray<NSString *> *names = [[variants allKeys] sortedArrayUsingSelector:@selector(compare:)];
                  for (NSString *name in names) {
                      resolve(name, variants[name], @"without-ui|without-mounting",
                              NSURLBookmarkResolutionWithoutUI | NSURLBookmarkResolutionWithoutMounting, expected);
                      resolve(name, variants[name], @"without-ui", NSURLBookmarkResolutionWithoutUI, expected);
                  }
              }
              return 0;
          }
          SCENEHUSH_OBJC
          xcrun clang -fobjc-arc -framework Foundation -framework CoreServices "$PROBE_WORK/probe.m" -o "$PROBE_WORK/probe"
          hdiutil create -srcfolder "$PROBE_WORK/source" -volname "SceneHush Bookmark Probe" -fs HFS+ -format UDRW "$PROBE_WORK/probe.dmg"
          hdiutil attach -readwrite -nobrowse -noautoopen -plist "$PROBE_WORK/probe.dmg" > "$PROBE_WORK/attach.plist"
          PROBE_VOLUME="$(python3 -c 'import plistlib,sys; p=plistlib.load(open(sys.argv[1],"rb")); print(next(e["mount-point"] for e in p["system-entities"] if "mount-point" in e))' "$PROBE_WORK/attach.plist")"
          cat > "$PROBE_WORK/transform.py" <<'SCENEHUSH_TRANSFORM'
          #!/usr/bin/env python3
          """Build controlled bookmark variants without modifying the vendored codecs."""

          import argparse
          import datetime
          import json
          from pathlib import Path
          import plistlib
          import re
          import struct
          import sys


          def header(data):
              if len(data) < 16:
                  return {"size": len(data), "header": "truncated"}
              magic, length, version, size = struct.unpack_from("<4sIII", data)
              return {"magic_hex": magic.hex(), "declared_size": length,
                      "version": f"0x{version:08x}", "header_size": size}


          def safe_key(key):
              if isinstance(key, int):
                  return f"0x{key:04x}"
              return "<redacted-string-key>"


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("project_root", type=Path)
              parser.add_argument("expected_file", type=Path)
              parser.add_argument("native_bookmark", type=Path)
              parser.add_argument("output_variants", type=Path)
              args = parser.parse_args()
              sys.path.insert(0, str(args.project_root / "scripts/installer/dmg/vendor"))
              from mac_alias import Bookmark
              from mac_alias import bookmark as constants

              native_bytes = args.native_bookmark.read_bytes()
              native = Bookmark.from_bytes(native_bytes)
              if not native.tocs:
                  raise ValueError("Native bookmark has no primary table")
              vendor = Bookmark.for_file(str(args.expected_file.resolve()))
              native_id, native_toc = native.tocs[0]
              vendor_id, vendor_toc = vendor.tocs[0]

              removed_keys = {
                  constants.kBookmarkVolumeBookmark,
                  constants.kBookmarkSandboxRwExtension,
                  constants.kBookmarkSandboxRoExtension,
              }
              stripped_toc = {key: value for key, value in native_toc.items() if key not in removed_keys}
              stripped = Bookmark([(native_id, stripped_toc)])
              anonymous_toc = dict(stripped_toc)
              if constants.kBookmarkUID in anonymous_toc:
                  anonymous_toc[constants.kBookmarkUID] = 99
              if constants.kBookmarkUserName in anonymous_toc:
                  anonymous_toc[constants.kBookmarkUserName] = "unknown"
              anonymous = Bookmark([(native_id, anonymous_toc)])
              roundtrip = native.to_bytes()
              variants = {
                  "vendor-original": vendor.to_bytes(),
                  "native-original": native_bytes,
                  "native-roundtrip": roundtrip,
                  "native-stripped": stripped.to_bytes(),
                  "native-stripped-anonymous": anonymous.to_bytes(),
              }
              args.output_variants.write_bytes(plistlib.dumps(variants))

              fields = {
                  "CNIDPath": constants.kBookmarkCNIDPath,
                  "VolumeUUID": constants.kBookmarkVolumeUUID,
                  "VolumeCreationDate": constants.kBookmarkVolumeCreationDate,
                  "VolumeProperties": constants.kBookmarkVolumeProperties,
                  "CreationOptions": constants.kBookmarkCreationOptions,
                  "WasFileReference": constants.kBookmarkWasFileReference,
                  "relativeBackgroundPath": constants.kBookmarkPath,
              }

              def safe_value(name, value):
                  if value is None:
                      return None
                  if isinstance(value, bool) or isinstance(value, (int, float)):
                      return value
                  if isinstance(value, datetime.datetime):
                      return value.isoformat()
                  if name == "CNIDPath" and isinstance(value, list):
                      return [item if isinstance(item, int) else "<redacted>" for item in value]
                  if name == "VolumeUUID" and isinstance(value, str):
                      return value if re.fullmatch(r"[0-9a-fA-F-]{32,36}", value) else "<redacted>"
                  if name == "VolumeProperties" and hasattr(value, "bytes"):
                      return {"data_hex": value.bytes.hex()}
                  if name == "relativeBackgroundPath" and isinstance(value, list):
                      # Only the intended public background components are useful to print.
                      return [part if part in (".background", "background.png") else "<redacted>" for part in value]
                  return "<redacted>"

              def structure(bookmark):
                  primary_id, toc = bookmark.tocs[0]
                  return {
                      "table_count": len(bookmark.tocs),
                      "primary_id": primary_id,
                      "primary_fields": sorted(
                          ({"key": safe_key(key), "type": type(value).__name__} for key, value in toc.items()),
                          key=lambda item: item["key"],
                      ),
                      "safe_fields": {name: safe_value(name, toc.get(key)) for name, key in fields.items()},
                  }

              native_safe = {name: safe_value(name, native_toc.get(key)) for name, key in fields.items()}
              vendor_safe = {name: safe_value(name, vendor_toc.get(key)) for name, key in fields.items()}
              output = {
                  "kind": "bookmark_structure_comparison",
                  "native_header": header(native_bytes),
                  "roundtrip_header": header(roundtrip),
                  "native": structure(native),
                  "vendor": structure(vendor),
                  "difference": {
                      "only_native": sorted(safe_key(key) for key in native_toc.keys() - vendor_toc.keys()),
                      "only_vendor": sorted(safe_key(key) for key in vendor_toc.keys() - native_toc.keys()),
                      "safe_field_values": {
                          name: {"native": native_safe[name], "vendor": vendor_safe[name]}
                          for name in fields if native_safe[name] != vendor_safe[name]
                      },
                  },
                  "stripped": {
                      "preserved_primary_id": native_id,
                      "removed_primary_keys": sorted(safe_key(key) for key in native_toc if key in removed_keys),
                      "removed_secondary_table_count": max(len(native.tocs) - 1, 0),
                      "anonymous_keys_rewritten": sorted(safe_key(key) for key in
                          (constants.kBookmarkUID, constants.kBookmarkUserName) if key in stripped_toc),
                  },
                  "variant_sizes": {name: len(data) for name, data in variants.items()},
              }
              print(json.dumps(output, sort_keys=True))


          if __name__ == "__main__":
              try:
                  main()
              except Exception as error:
                  # Input paths and bookmark parser messages can expose developer paths.
                  print("Bookmark transform failed: " + type(error).__name__, file=sys.stderr)
                  raise SystemExit(2)
          SCENEHUSH_TRANSFORM
          "$PROBE_WORK/probe" create "$PROBE_VOLUME/.background/background.png" "$PROBE_WORK/native.book"
          python3 "$PROBE_WORK/transform.py" "$PROJECT_ROOT" "$PROBE_VOLUME/.background/background.png" "$PROBE_WORK/native.book" "$PROBE_WORK/variants.plist"
          "$PROBE_WORK/probe" "$PROBE_VOLUME/.background/background.png" "$PROBE_WORK/variants.plist"
