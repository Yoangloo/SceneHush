name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Require a version tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Run this workflow on a tag such as v1.0.0.\n' >&2
            exit 1
          fi
          printf 'value=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Test
        run: make test
      - name: Build universal app and packages
        run: ./scripts/package.sh --arch universal --version '${{ steps.version.outputs.value }}'
      - name: Inspect installer and release archives without installing
        run: python3 scripts/installer/verify-package.py --arch universal
      - name: Prepare English, Chinese, and Japanese release notes
        run: ./scripts/release-notes.sh '${{ steps.version.outputs.value }}' > build/release-notes.md
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag \
              --title "SceneHush ${RELEASE_TAG#v}" --notes-file build/release-notes.md
          fi

